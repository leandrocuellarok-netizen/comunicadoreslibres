name: Expand uploaded site ZIP

on:
  push:
    branches: [main]
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract site files
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          test -f extracted/comunicadores-libres/package.json
          cp -a extracted/comunicadores-libres/. .
          rm -rf extracted "$ZIP_FILE"
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .github/workflows/deploy.yml || true
          git commit -m "Extract Comunicadores Libres site source"
          git push
