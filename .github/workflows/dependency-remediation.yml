name: Temporary dependency remediation

on:
  push:
    branches:
      - maintenance/dependency-audit-2026-11-28

permissions:
  contents: write

concurrency:
  group: dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply non-forced audit fixes
        run: npm audit fix --no-fund || true

      - name: Reinstall from updated lockfile
        run: npm ci

      - name: Report remaining advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-after.json" || true
          node - "$RUNNER_TEMP/npm-audit-after.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log('POST-FIX AUDIT:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log('REMAINING', name, 'severity=' + item.severity, 'direct=' + item.isDirect, 'fixAvailable=' + JSON.stringify(item.fixAvailable));
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build, prerender and smoke tests
        run: npm run build

      - name: Commit tested dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency files changed."
          else
            git commit -m "chore(deps): apply non-forced npm audit fixes"
            git push origin HEAD:maintenance/dependency-audit-2026-11-28
          fi
